services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "10000:10000"
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: next_local
      DB_USERNAME: next_user
      DB_PASSWORD: next_password
      CRON_SECRET: ${CRON_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_COUNTRY: ${ADMIN_COUNTRY}
      ADMIN_ROLE: admin
    volumes:
      - ./scraper/storage/scholarships.json:/shared-data/scholarships.json:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: next_local
      POSTGRES_USER: next_user
      POSTGRES_PASSWORD: next_password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data: