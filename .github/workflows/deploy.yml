name: Push Docker Image

on:
  workflow_run:
    workflows: [ "Construire image docker" ]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/next-api

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: write

    steps:
      - name: Download build artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const matchArtifact = artifacts.data.artifacts.find(
              (artifact) => artifact.name === "php-docker-image"
            );

            if (!matchArtifact) {
              core.setFailed("Could not find the php-docker-image artifact");
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: matchArtifact.id,
              archive_format: "zip",
            });

            fs.writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/php-docker-image.zip`,
              Buffer.from(download.data)
            );

      - name: Unzip artifact
        run: unzip -o php-docker-image.zip -d /tmp

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker image
        run: docker load --input /tmp/php-image.tar

      - name: Push Docker image
        run: |
          IMAGE_REFS=$(docker images --filter=reference="${REGISTRY}/${IMAGE_NAME}" --format '{{.Repository}}:{{.Tag}}')
          for ref in $IMAGE_REFS; do
            docker push "$ref"
          done

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            cd ~/next-api
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f