name: Construire image docker

on:
  pull_request:
    branches:
      - backend-dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/next-api

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        run: |
            echo "name=$(echo '${{ github.repository}}' | tr '[:upper:]' '[:lower:]')/next-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build image and export to tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/php-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: php-docker-image
          path: /tmp/php-image.tar
          retention-days: 1